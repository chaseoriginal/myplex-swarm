---
# Deploy myplex-swarm env file to the swarm leader
# Usage: ansible-playbook ansible/deploy-myplex-secrets.yml --vault-password-file ~/ansible/vault

- name: Deploy myplex-swarm secrets
  hosts: myplex
  become: false
  vars:
    stack_dir: /data/compose/myplex-swarm

  tasks:
    - name: Ensure stack directory exists
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: directory
        mode: "0755"

    - name: Copy .env file
      ansible.builtin.copy:
        src: ../.env
        dest: "{{ stack_dir }}/.env"
        mode: "0644"
      notify: restart_plex

  handlers:
    - name: restart_plex
      ansible.builtin.command:
        cmd: docker stack deploy -c {{ stack_dir }}/docker-compose.yml {{ stack_name }}
      listen: "restart plex"
