# myplex-swarm — Plex Media Server ("My Multiplex") as a Docker Swarm service.
#
# Reconciled 2026-10-25 to mirror the live service spec exactly, so a redeploy
# is a no-op instead of a regression.
#
# Two settings are load-bearing — do not "clean them up":
#
# 1. VERSION=latest
#    Enables the LinuxServer.io runtime update check against Plex channel 8
#    (Plex Pass beta). The alternative values are both wrong:
#      - VERSION=beta   -> the image treats it as a literal version string and
#                          tries to download .../plex-media-server-new/beta/...
#                          which returns HTTP 403, so the update silently fails
#                          and PMS stays on the version baked into the image.
#      - VERSION=docker -> skips the update check entirely and pins PMS to
#                          whatever the image ships (public channel only).
#    With VERSION=latest the container downloads the Plex Pass beta build
#    (1.43.5.11079-b3b13e506) and dpkg-installs it on every start.
#
# 2. NO `user:` directive
#    Non-root mode makes the image skip the runtime update entirely
#    ("Runtime update not supported with read-only or non-root operation").
#    The service must start as root so the s6 init can install the .deb.
#    PUID/PGID below are passed to the image so the Plex process itself still
#    runs as uid/gid 1000.
#
# Networking is host mode: the external overlay myplex-swarm_default does not
# exist on this swarm, and NPM proxies straight to the host port.
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    environment:
      - TZ=America/Chicago
      - PUID=1000
      - PGID=1000
      - ADVERTISE_IP=https://216.165.142.70:32402
      - VERSION=latest
    volumes:
      - myplex_swarm_config:/config
      - myplex_swarm_transcode:/transcode
      - /media/Multimedia:/media:ro
      - /media/Multimedia/Music:/music:ro
    network_mode: host
    deploy:
      mode: replicated
      replicas: 1
      # No CPU/memory limits or reservations — deliberately matches the other
      # Plex servers (lplex has no resources block at all). The previous
      # `limits: cpus 1 / memory 1G` capped PMS at one core and 1 GiB, which
      # is what forced Plex's `DatabaseCacheSize` to stay at the 40 MB default:
      # a 1024 MB DB cache inside a 1 GiB cgroup is an OOM kill (exit 137 /
      # unhealthy container). Plex peaked at ~665 MB RSS during a scan on a
      # 1-core limit and was visibly CPU-throttled at 100%.
      placement:
        constraints:
          - node.hostname==ore-dock-110-2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: continue
        monitor: 60s
        max_failure_ratio: 0.3

volumes:
  myplex_swarm_config:
    name: myplex_swarm_config
  myplex_swarm_transcode:
    name: myplex_swarm_transcode
